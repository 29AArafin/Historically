<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Playing — Historically</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/play.css">
</head>
<body>
  <!-- Full-screen grounded era stage -->
  <div id="world-stage" class="world-stage">
    <canvas id="world-canvas" class="world-canvas" aria-hidden="true"></canvas>

    <!-- Tiny corner HUD: round counter, current year + era, score and sound -->
    <nav class="game-hud" aria-label="Game status">
      <span id="hud-round" class="hud-round">1/7</span>
      <div class="hud-center">
        <a class="hud-logo" href="index.html" aria-label="Back to home">HISTORICALLY</a>
        <p class="hud-era">
          <span id="hud-year">2026 CE</span>
          <span class="hud-era__sep" aria-hidden="true">·</span>
          <span id="hud-era-name">DIGITAL AGE</span>
        </p>
      </div>
      <div class="hud-right">
        <span id="hud-score" class="hud-score">SCORE 0</span>
        <button id="mute-toggle" class="hud-mute" type="button" aria-pressed="false">SFX ON</button>
      </div>
    </nav>

    <!-- In-world floating prompt panel (notched pixel corners, scanline texture) -->
    <div id="prompt-anchor" class="prompt-anchor is-hidden" aria-live="polite">
      <div class="prompt-frame">
        <div class="prompt-panel">
          <p id="prompt-label" class="prompt-label">PROMPT 1 OF 7</p>
          <h1 id="prompt-question" class="prompt-question">Loading…</h1>
          <p class="prompt-hint">rarer answers travel further back</p>
        </div>
      </div>
    </div>

    <!-- Large rolling year counter during a jump -->
    <div id="travel-counter" class="travel-counter" hidden aria-hidden="true">
      <span id="travel-counter-year" class="travel-counter__year">2026</span>
      <span id="travel-counter-suffix" class="travel-counter__suffix">CE</span>
    </div>

    <!-- Landing title card: rarity tier, era and destination year -->
    <div id="landing-tier" class="landing-tier" hidden role="dialog" aria-labelledby="landing-tier-name" aria-describedby="landing-tier-body">
      <p id="landing-tier-name" class="landing-tier__name"></p>
      <div id="landing-tier-body">
        <p id="landing-tier-answer" class="landing-tier__answer"></p>
        <p class="landing-tier__score">
          <span id="landing-tier-points" class="landing-tier__points"></span>
          <span aria-hidden="true">·</span>
          <span id="landing-tier-travel" class="landing-tier__travel"></span>
        </p>
        <p id="landing-tier-year" class="landing-tier__year"></p>
        <p id="landing-tier-era" class="landing-tier__era"></p>
        <p id="landing-tier-flavour" class="landing-tier__flavour"></p>
      </div>
      <button id="landing-tier-continue" class="landing-tier__continue" type="button">Continue</button>
    </div>

    <!-- Bottom-docked answer input with thin pixel timer bar on top edge -->
    <div id="answer-dock" class="answer-dock">
      <div class="answer-timer-meta" id="timer-meta">
        <span>TIMER</span>
        <span id="timer-clock">0:25</span>
      </div>
      <div class="answer-frame">
        <div class="answer-box">
          <div class="timer-track">
            <div id="timer-fill" class="timer-fill"></div>
          </div>
          <form id="answer-form" class="answer-form" action="javascript:void(0)">
            <label for="answer-input" class="sr-only">Your answer</label>
            <input
              id="answer-input"
              class="answer-input"
              type="text"
              placeholder="type a historical answer…"
              autocomplete="off"
              spellcheck="false"
              disabled
            >
          </form>
        </div>
      </div>
      <p id="answer-feedback" class="answer-feedback" role="status" aria-live="polite" hidden></p>
    </div>
  </div>

  <!-- CRT scanline overlay & fade curtain -->
  <div class="crt-scanlines" aria-hidden="true"></div>
  <div id="fade-curtain" class="fade-curtain" aria-hidden="true"></div>

  <!-- Modular scripts: data → era art → renderer → travel → HUD → game loop -->
  <script src="data/prompts.js"></script>
  <script src="js/game-data.js"></script>
  <script src="js/eras/era-utils.js"></script>
  <script src="js/eras/01-digital.js"></script>
  <script src="js/eras/02-cold-war.js"></script>
  <script src="js/eras/03-world-wars.js"></script>
  <script src="js/eras/04-industrial.js"></script>
  <script src="js/eras/05-revolutions.js"></script>
  <script src="js/eras/06-renaissance.js"></script>
  <script src="js/eras/07-medieval.js"></script>
  <script src="js/eras/08-classical.js"></script>
  <script src="js/eras/09-bronze-age.js"></script>
  <script src="js/eras/10-prehistory.js"></script>
  <script src="js/eras/eras-config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/time-machine.js"></script>
  <script src="js/time-travel.js"></script>
  <script src="js/scene-renderer.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/prompt-panel.js"></script>
  <script src="js/game-loop.js"></script>
</body>
</html>
